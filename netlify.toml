[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Advocate outreach email batch — 10am IST = 04:30 UTC
[functions.'send-batch-background']
  schedule = "30 4 * * *"

# Scheduled WhatsApp broadcasts — check every 5 minutes
[functions.'scheduled-broadcast-background']
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
