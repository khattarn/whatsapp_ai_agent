[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Advocate outreach email batch — 10am IST = 04:30 UTC
[functions.'send-batch-background']
  schedule = "30 4 * * *"

# Scheduled WhatsApp broadcasts — check every 5 minutes
[functions.'scheduled-broadcast-background']
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Public asset URLs: serve the Supabase 'assets' storage bucket from this site's own domain.
# status 200 = proxied (not a 301/302), which is what Meta needs when it fetches template/broadcast media.
# Project ref must match SUPABASE_URL; update here if the Supabase project ever changes.
[[redirects]]
  from = "/assets/*"
  to = "https://wbxhdagtlcrnianqkwdo.supabase.co/storage/v1/object/public/assets/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
